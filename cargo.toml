[package]
name = "red-robin"
version = "0.1.0"
edition = "2021"
authors = ["Red Robin Contributors"]
description = "A configurable Linux network connectivity and diagnostics tester"
readme = "README.md"
repository = "https://github.com/yourusername/red-robin"
license = "GPL-3.0-or-later"
keywords = ["network", "diagnostics", "ping", "dns", "tor", "i2p"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
anyhow = "1.0"
thiserror = "2.0"